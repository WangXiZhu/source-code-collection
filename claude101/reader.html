<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude 101 Reader</title>
  <style>
    :root {
      --bg: #f6f2ea;
      --panel: #fffdf8;
      --panel-2: #f1eadf;
      --ink: #181512;
      --muted: #6b6258;
      --line: #ded2c2;
      --accent: #0f766e;
      --shadow: 0 12px 30px rgba(24, 21, 18, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Georgia", "Noto Serif SC", serif; }
    body { min-height: 100vh; }
    .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns 180ms ease; }
    .app.sidebar-collapsed { grid-template-columns: 76px minmax(0, 1fr); }
    .sidebar {
      background: linear-gradient(180deg, #efe4d3 0%, #f6f2ea 100%);
      border-right: 1px solid var(--line);
      padding: 24px 18px 28px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .sidebar-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .brand { margin-bottom: 20px; }
    .brand h1 { font-size: 30px; line-height: 1.1; margin: 0 0 8px; }
    .brand p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .sidebar-toggle {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 999px;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      cursor: pointer;
      font: inherit;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 20px; }
    .controls button, .nav-buttons button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    .controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tree-section { margin: 18px 0 0; }
    .tree-section h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .tree-list { list-style: none; padding: 0; margin: 0; }
    .tree-list li { margin: 0 0 6px; }
    .tree-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font: inherit;
    }
    .tree-item:hover { background: rgba(255,255,255,0.55); }
    .tree-item.active { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
    .tree-item .num { display: inline-block; min-width: 26px; color: var(--muted); font-size: 13px; }
    .app.sidebar-collapsed .sidebar { padding-left: 12px; padding-right: 12px; }
    .app.sidebar-collapsed .brand p,
    .app.sidebar-collapsed .controls,
    .app.sidebar-collapsed #tree,
    .app.sidebar-collapsed .reading-order { display: none; }
    .app.sidebar-collapsed .brand { margin: 0; }
    .app.sidebar-collapsed .brand h1 {
      font-size: 14px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      margin: 6px 0 0;
      letter-spacing: 0.04em;
    }
    .app.sidebar-collapsed .sidebar-top { flex-direction: column; align-items: center; gap: 14px; }
    .content { padding: 28px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .meta h2 { margin: 0 0 6px; font-size: 34px; line-height: 1.05; }
    .meta p { margin: 0; color: var(--muted); }
    .source-link { display: inline-flex; align-items: center; margin-top: 6px; color: var(--accent); text-decoration: none; font-size: 14px; }
    .source-link:hover { text-decoration: underline; }
    .nav-buttons { display: flex; gap: 8px; }
    .reader.dual { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 18px; }
    .reader.single { display: block; }
    .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
    .pane-header { padding: 12px 16px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .pane-body { padding: 22px 24px 28px; line-height: 1.75; font-size: 17px; }
    .pane-body h1, .pane-body h2, .pane-body h3, .pane-body h4 { line-height: 1.2; margin: 1.3em 0 0.55em; }
    .pane-body h1 { font-size: 30px; }
    .pane-body h2 { font-size: 26px; }
    .pane-body h3 { font-size: 21px; }
    .pane-body h4 { font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .pane-body p { margin: 0 0 1em; }
    .pane-body ul, .pane-body ol { margin: 0 0 1em 1.2em; padding: 0; }
    .pane-body li { margin: 0 0 0.5em; }
    .pane-body table { width: 100%; border-collapse: collapse; margin: 0 0 1.2em; font-size: 15px; }
    .pane-body th, .pane-body td { border: 1px solid var(--line); padding: 10px 12px; vertical-align: top; }
    .pane-body th { background: #f6efe4; text-align: left; }
    .pane-body a { color: var(--accent); }
    .reading-order { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.55); color: var(--muted); font-size: 14px; line-height: 1.6; }
    .loading { color: var(--muted); font-style: italic; }
    @media (max-width: 980px) {
      .app, .app.sidebar-collapsed { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .app.sidebar-collapsed .brand p,
      .app.sidebar-collapsed .controls,
      .app.sidebar-collapsed #tree,
      .app.sidebar-collapsed .reading-order { display: block; }
      .app.sidebar-collapsed .brand h1 {
        font-size: 30px;
        writing-mode: initial;
        transform: none;
        margin: 0 0 8px;
        letter-spacing: 0;
      }
      .app.sidebar-collapsed .sidebar-top { flex-direction: row; align-items: flex-start; }
      .reader.dual { grid-template-columns: 1fr; }
      .content { padding: 18px; }
      .meta h2 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <h1>Claude 101</h1>
          <p>Bilingual reading site with a fixed lesson order and section tree.</p>
        </div>
        <button id="sidebarToggle" class="sidebar-toggle" aria-label="Collapse sidebar" title="Collapse sidebar">◀</button>
      </div>
      <div class="controls" id="viewModes">
        <button data-mode="dual" class="active">EN + 中文</button>
        <button data-mode="en">English</button>
        <button data-mode="zh">中文</button>
      </div>
      <div id="tree"></div>
      <div class="reading-order">
        Reading order is fixed by the course tree: start from lesson 1 and move downward section by section.
      </div>
    </aside>
    <main class="content">
      <div class="toolbar">
        <div class="meta">
          <p id="sectionLabel"></p>
          <h2 id="lessonTitle"></h2>
          <a id="sourceLink" class="source-link" href="#" target="_blank" rel="noreferrer">原文链接</a>
          <p id="lessonOrder"></p>
        </div>
        <div class="nav-buttons">
          <button id="prevBtn">Previous</button>
          <button id="nextBtn">Next</button>
        </div>
      </div>
      <div id="reader" class="reader dual"><p class="loading">Loading lesson content...</p></div>
    </main>
  </div>
  <script>
    const app = document.querySelector(".app");
    const treeRoot = document.getElementById("tree");
    const reader = document.getElementById("reader");
    const sectionLabel = document.getElementById("sectionLabel");
    const lessonTitle = document.getElementById("lessonTitle");
    const sourceLink = document.getElementById("sourceLink");
    const lessonOrder = document.getElementById("lessonOrder");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const viewModeButtons = document.querySelectorAll("#viewModes button");
    const sidebarToggle = document.getElementById("sidebarToggle");

    let courseData;
    let lessons;
    let lessonMap;
    let currentSlug = "";
    let currentMode = "dual";
    let sidebarCollapsed = false;
    const htmlCache = new Map();

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function parseInline(text) {
      return escapeHtml(text).replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noreferrer">$1<\/a>'
      );
    }

    function markdownToHtml(markdown) {
      const lines = markdown.replace(/\r/g, "").split("\n");
      const html = [];
      let i = 0;

      const flushParagraph = (buffer) => {
        if (!buffer.length) return;
        html.push('<p>' + parseInline(buffer.join(" ")) + '</p>');
        buffer.length = 0;
      };

      while (i < lines.length) {
        const trimmed = lines[i].trim();
        if (!trimmed) { i += 1; continue; }

        if (/^#{1,6}\s+/.test(trimmed)) {
          const level = trimmed.match(/^#+/)[0].length;
          html.push('<h' + level + '>' + parseInline(trimmed.slice(level).trim()) + '</h' + level + '>');
          i += 1;
          continue;
        }

        if (/^\|/.test(trimmed)) {
          const tableLines = [];
          while (i < lines.length && /^\|/.test(lines[i].trim())) {
            tableLines.push(lines[i].trim());
            i += 1;
          }
          const rows = tableLines
            .filter((row, idx) => !(idx === 1 && /^\|(?:\s*---\s*\|)+$/.test(row + "|")))
            .map((row) => row.slice(1, row.endsWith("|") ? -1 : undefined).split("|").map((cell) => cell.trim()));
          const head = rows[0] || [];
          const body = rows.slice(1);
          html.push("<table>");
          if (head.length) {
            html.push("<thead><tr>");
            head.forEach((cell) => html.push("<th>" + parseInline(cell) + "</th>"));
            html.push("</tr></thead>");
          }
          if (body.length) {
            html.push("<tbody>");
            body.forEach((row) => {
              html.push("<tr>");
              row.forEach((cell) => html.push("<td>" + parseInline(cell) + "</td>"));
              html.push("</tr>");
            });
            html.push("</tbody>");
          }
          html.push("</table>");
          continue;
        }

        if (/^\d+\.\s+/.test(trimmed)) {
          html.push("<ol>");
          while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
            html.push("<li>" + parseInline(lines[i].trim().replace(/^\d+\.\s+/, "")) + "</li>");
            i += 1;
          }
          html.push("</ol>");
          continue;
        }

        if (/^-\s+/.test(trimmed)) {
          html.push("<ul>");
          while (i < lines.length && /^-\s+/.test(lines[i].trim())) {
            html.push("<li>" + parseInline(lines[i].trim().slice(2)) + "</li>");
            i += 1;
          }
          html.push("</ul>");
          continue;
        }

        const paragraph = [];
        while (i < lines.length) {
          const current = lines[i].trim();
          if (!current || /^#{1,6}\s+/.test(current) || /^\|/.test(current) || /^\d+\.\s+/.test(current) || /^-\s+/.test(current)) break;
          paragraph.push(current);
          i += 1;
        }
        flushParagraph(paragraph);
      }

      return html.join("\n");
    }

    async function fetchMarkdownAsHtml(pathname) {
      if (!pathname) return "<p>Content not available.</p>";
      if (htmlCache.has(pathname)) return htmlCache.get(pathname);
      const response = await fetch(pathname);
      if (!response.ok) {
        const fallback = "<p>Content not available.</p>";
        htmlCache.set(pathname, fallback);
        return fallback;
      }
      const markdown = await response.text();
      const html = markdownToHtml(markdown);
      htmlCache.set(pathname, html);
      return html;
    }

    function renderTree() {
      treeRoot.innerHTML = "";
      courseData.sections.forEach((group) => {
        const section = document.createElement("section");
        section.className = "tree-section";
        const heading = document.createElement("h2");
        heading.textContent = group.section;
        section.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "tree-list";
        group.items.forEach(([slug, title]) => {
          const lesson = lessonMap.get(slug);
          const li = document.createElement("li");
          const button = document.createElement("button");
          button.className = "tree-item" + (slug === currentSlug ? " active" : "");
          button.innerHTML = '<span class="num">' + String(lesson.order).padStart(2, "0") + "</span>" + title;
          button.addEventListener("click", () => {
            currentSlug = slug;
            render();
          });
          li.appendChild(button);
          list.appendChild(li);
        });
        section.appendChild(list);
        treeRoot.appendChild(section);
      });
    }

    function pane(label, html) {
      return '<section class="pane"><div class="pane-header">' + label + '</div><div class="pane-body">' + html + '</div></section>';
    }

    async function renderReader(lesson) {
      reader.className = "reader " + (currentMode === "dual" ? "dual" : "single");
      const enHtml = await fetchMarkdownAsHtml(lesson.enPath);
      const zhHtml = lesson.hasZh ? await fetchMarkdownAsHtml(lesson.zhPath) : "<p>Chinese translation not available.</p>";
      if (currentMode === "en") {
        reader.innerHTML = pane("English", enHtml);
        return;
      }
      if (currentMode === "zh") {
        reader.innerHTML = pane("中文", zhHtml);
        return;
      }
      reader.innerHTML = pane("English", enHtml) + pane("中文", zhHtml);
    }

    function renderMeta(lesson) {
      sectionLabel.textContent = lesson.section;
      lessonTitle.textContent = lesson.title;
      sourceLink.href = lesson.sourceUrl || "#";
      sourceLink.style.display = lesson.sourceUrl ? "inline-flex" : "none";
      lessonOrder.textContent = "Reading order: " + lesson.order + " / " + lessons.length;
      const index = lessons.findIndex((item) => item.slug === lesson.slug);
      prevBtn.disabled = index <= 0;
      nextBtn.disabled = index >= lessons.length - 1;
      prevBtn.onclick = () => {
        if (index > 0) {
          currentSlug = lessons[index - 1].slug;
          render();
        }
      };
      nextBtn.onclick = () => {
        if (index < lessons.length - 1) {
          currentSlug = lessons[index + 1].slug;
          render();
        }
      };
    }

    async function render() {
      const lesson = lessonMap.get(currentSlug);
      app.classList.toggle("sidebar-collapsed", sidebarCollapsed && window.innerWidth > 980);
      sidebarToggle.textContent = sidebarCollapsed && window.innerWidth > 980 ? "▶" : "◀";
      sidebarToggle.setAttribute("aria-label", sidebarCollapsed && window.innerWidth > 980 ? "Expand sidebar" : "Collapse sidebar");
      sidebarToggle.title = sidebarCollapsed && window.innerWidth > 980 ? "Expand sidebar" : "Collapse sidebar";
      renderTree();
      renderMeta(lesson);
      reader.innerHTML = '<p class="loading">Loading lesson content...</p>';
      await renderReader(lesson);
      history.replaceState(null, "", "#" + currentSlug);
    }

    async function init() {
      const response = await fetch("./manifest.json");
      courseData = await response.json();
      lessons = courseData.lessons;
      lessonMap = new Map(lessons.map((item) => [item.slug, item]));

      viewModeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          currentMode = button.dataset.mode;
          viewModeButtons.forEach((item) => item.classList.toggle("active", item === button));
          render();
        });
      });

      sidebarToggle.addEventListener("click", () => {
        if (window.innerWidth <= 980) return;
        sidebarCollapsed = !sidebarCollapsed;
        render();
      });

      window.addEventListener("resize", () => render());

      const hashSlug = location.hash.slice(1);
      currentSlug = lessonMap.has(hashSlug) ? hashSlug : lessons[0].slug;
      await render();
    }

    init();
  </script>
</body>
</html>
